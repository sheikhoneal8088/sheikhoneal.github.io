<!DOCTYPE html>
<html>
<head>
    <title>Sheikhoneal's Repo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Loading screen */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 1s ease 2.5s forwards;
        }

        .loader-text {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 6px;
            animation: pulse 1s infinite alternate;
        }

        /* Main website */
        #website {
            opacity: 0;
            animation: showWebsite 1s ease 2.5s forwards;
            text-align: center;
            padding-top: 150px;
        }

        @keyframes pulse {
            from {
                opacity: 0.3;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes showWebsite {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="loader-text">SHEIKHONEAL</div>
    </div>

    <div id="website">
        <h1>SheikhONeal's Repo Presents🚀</h1>
        <p>Built from scratch with HTML.</p>
    </div>

</body>
</html>
